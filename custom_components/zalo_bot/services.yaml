send_message:
  description: Gửi tin nhắn Zalo
  fields:
    message:
      description: Nội dung tin nhắn
      example: Hello từ Home Assistant
      required: true
      selector:
        text: null
    thread_id:
      description: ThreadId nhận tin nhắn (user hoặc group)
      example: '5841349563795164131'
      required: true
      selector:
        text: null
    account_selection:
      description: Số điện thoại tài khoản gửi
      example: '+84123456789'
      required: true
      selector:
        text: null
    type:
      description: 'Loại gửi: 0=user, 1=group (mặc định 0)'
      example: 0
      default: 0
      selector:
        select:
          options:
          - label: User
            value: '0'
          - label: Group
            value: '1'
    ttl:
      description: TTL tự xóa của từng tin nhắn. zca-js nhận milliseconds; UI hỗ trợ 1-24 giờ và các mốc ngày. Không thay đổi Auto Delete của cả cuộc trò chuyện.
      required: false
      selector:
        select:
          options:
          - label: Không tự xóa
            value: 'off'
          - label: 1 giờ
            value: 1h
          - label: 2 giờ
            value: 2h
          - label: 3 giờ
            value: 3h
          - label: 4 giờ
            value: 4h
