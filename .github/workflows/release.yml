name: Build and Publish HACS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, for example 2026.08.19.0900"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: zalo-bot-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: YYYY.MM.DD.HHMM (example 2026.08.19.0900)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/zalo_bot/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Use a new version."
            exit 1
          fi

          git add custom_components/zalo_bot/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $TAG"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

          # Create a lightweight tag pointing to the exact commit whose manifest
          # already contains the release version. Do not move tags after release.
          git tag "$TAG"
          git push origin "$TAG"

      - name: Verify repository structure and version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          test -f hacs.json
          test -f custom_components/zalo_bot/__init__.py
          test -f custom_components/zalo_bot/manifest.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("custom_components/zalo_bot/manifest.json").read_text(encoding="utf-8"))

          assert hacs.get("zip_release") is True, "hacs.json: zip_release must be true"
          assert hacs.get("filename") == "zalo_bot.zip", "hacs.json: filename must be zalo_bot.zip"
          assert manifest.get("domain") == "zalo_bot", "manifest domain must be zalo_bot"
          assert manifest.get("version") == os.environ["VERSION"], (
              f"manifest version {manifest.get('version')!r} does not match release {os.environ['VERSION']!r}"
          )
          PY

          python3 -m compileall -q custom_components/zalo_bot

      - name: Build HACS release asset
        shell: bash
        run: |
          set -euo pipefail
          rm -f zalo_bot.zip
          find custom_components/zalo_bot -type d -name __pycache__ -prune -exec rm -rf {} +
          find custom_components/zalo_bot -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete
          cd custom_components/zalo_bot
          zip -q -r "$GITHUB_WORKSPACE/zalo_bot.zip" . \
            -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          cd "$GITHUB_WORKSPACE"

          # HACS extracts a zip_release directly into /config/custom_components/zalo_bot.
          # Therefore manifest.json must be at the root of the release ZIP.
          unzip -Z1 zalo_bot.zip | grep -qx "manifest.json"
          unzip -Z1 zalo_bot.zip | grep -qx "__init__.py"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" zalo_bot.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" zalo_bot.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
